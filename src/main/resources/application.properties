spring.application.name=titishop-backend
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
app.jwt.issuer=titishop-backend
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-minimum-32-bytes}
app.jwt.expiration-minutes=120
app.factiliza.api-token=${FACTILIZA_API_TOKEN:}
app.factiliza.api-base-url=${FACTILIZA_API_BASE_URL:https://api.factiliza.com/v1}
springdoc.swagger-ui.path=/swagger
